name: Auto Semantic Version Tag

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          git fetch --tags

          LATEST=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi

          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.email ${{ secrets.BOT_E_MAIL }}
          git config user.password ${{ secrets.BOT_PASSWORD }}

          git tag ${{ steps.bump.outputs.new }}
          git push origin ${{ steps.bump.outputs.new }}