
name: Build Script

on: push

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Set up CK tool
        run: |
          mkdir -p tools

          URL=$(curl -s https://api.github.com/repos/mauricioaniche/ck/releases/latest \
            | grep browser_download_url \
            | grep jar \
            | cut -d '"' -f 4)

          echo "Downloading CK from: $URL"
          curl -L -o tools/ck.jar "$URL"

      - name: Run CK Metrics
        run: |
          java -jar tools/ck.jar . true 0 false

      - name: Show class metrics
        run: |
          cat class.csv

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: ck-reports
          path: |
            class.csv