
name: Build Script

on: push

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '21'

      - name: Compile
        run: |
          mkdir -p out
          find . -path "*/src/java/*" -name "*.java" > sources.txt
          javac -d out @sources.txt

      - name: Run Tests
        run: |
          mkdir -p out-test
          find . -path "*/src/test/*" -name "*.java" > tests.txt
          javac -cp "out:lib/*" -d out-test @tests.txt

      - name: Create JAR
        run: |
          mkdir -p dist
          jar --create --file dist/app.jar -C out
