
name: Build Script

on: push

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Set up CK tool
        run: |
          mkdir -p tools
          curl -L -o tools/ck.jar \
            https://github.com/mauricioaniche/ck/releases/download/0.7.1/ck-0.7.1-SNAPSHOT-jar-with-dependencies.jar

      - name: Run CK Metrics
        run: |
          java -jar tools/ck.jar . true 0 false

      - name: Show class metrics
        run: |
          cat class.csv

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: ck-reports
          path: |
            class.csv